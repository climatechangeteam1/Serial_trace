<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<title>أثر متسلسل — لعبة تحقيق جماعية</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#060914;
  --panel:#0c1224;
  --panel2:#111a31;
  --line:#243052;
  --blue:#38bdf8;
  --cyan:#22d3ee;
  --purple:#8b5cf6;
  --green:#34d399;
  --red:#fb7185;
  --gold:#fbbf24;
  --text:#eef4ff;
  --muted:#94a3b8;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100%}
body{
  background:
    radial-gradient(circle at 20% 10%,rgba(56,189,248,.10),transparent 28%),
    radial-gradient(circle at 80% 20%,rgba(139,92,246,.10),transparent 30%),
    linear-gradient(145deg,#050712,#090e1e 50%,#060914);
}
button,input,select{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.screen{
  display:none;
  min-height:100vh;
  padding:18px;
  animation:screenIn .28s ease;
}
.screen.active{display:flex;flex-direction:column}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.container{width:min(1050px,100%);margin:auto}
.logo{
  font-size:clamp(38px,10vw,82px);
  font-weight:900;
  letter-spacing:2px;
  text-align:center;
  background:linear-gradient(90deg,#fff,#38bdf8,#8b5cf6);
  -webkit-background-clip:text;
  color:transparent;
}
.subtitle{text-align:center;color:var(--muted);font-size:18px;margin:10px 0 35px}
.card{
  background:linear-gradient(145deg,rgba(17,26,49,.92),rgba(8,14,30,.94));
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
}
.menu{display:grid;gap:12px;max-width:520px;margin:auto}
.btn{
  border:1px solid #2c3c65;
  border-radius:15px;
  padding:15px 18px;
  color:white;
  background:#111a31;
  transition:.2s;
  min-height:52px;
}
.btn:hover,.btn:active{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 0 22px rgba(56,189,248,.15)}
.btn.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);border:0}
.btn.success{background:linear-gradient(135deg,#047857,#0f766e);border:0}
.btn.danger{background:linear-gradient(135deg,#991b1b,#be123c);border:0}
.btn.gold{background:linear-gradient(135deg,#a16207,#b45309);border:0}
.btn.small{min-height:40px;padding:9px 13px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.center{text-align:center}
h1,h2,h3{margin-top:0}
.muted{color:var(--muted)}
.badge{
 display:inline-flex;padding:6px 10px;border-radius:99px;
 background:#17213d;border:1px solid #2a3b65;color:#bfeaff;font-size:12px
}
.header{
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;margin-bottom:14px;position:sticky;top:0;z-index:20;
 padding:10px 0;background:rgba(6,9,20,.88);backdrop-filter:blur(14px)
}
.header-title{font-weight:800}
.grid{display:grid;gap:14px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.screen{padding:12px}}
input{
 width:100%;background:#080e1e;border:1px solid #29385d;
 border-radius:13px;color:white;padding:14px;outline:none
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,189,248,.08)}
.player-input{margin:8px 0}
.big-number{font-size:48px;font-weight:900;color:var(--cyan);text-align:center}
.choice{
 width:100%;text-align:right;padding:16px;border-radius:15px;
 border:1px solid #263659;background:#0b1328;color:white;margin:8px 0;
}
.choice:hover{border-color:var(--cyan);background:#101c38}
.choice .ct{font-weight:800;font-size:17px}
.choice .cd{color:var(--muted);font-size:13px;margin-top:6px}
.case-card{
 position:relative;overflow:hidden;min-height:190px;
 display:flex;flex-direction:column;justify-content:space-between
}
.case-card.locked{opacity:.55}
.case-number{color:var(--cyan);font-size:13px}
.case-title{font-size:22px;font-weight:900;margin:8px 0}
.case-city{color:#c4b5fd}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:12px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#0b1225;color:#b9c6dd;padding:10px 13px;border-radius:99px}
.tab.active{background:#17305a;color:#fff;border-color:var(--blue)}
.panel{margin-bottom:14px}
.stat{
 padding:14px;border:1px solid var(--line);border-radius:16px;background:#0a1123;text-align:center
}
.stat b{display:block;font-size:24px;color:var(--cyan)}
.evidence-card,.suspect-card,.timeline-card{
 border:1px solid #253354;background:#0a1122;border-radius:17px;padding:15px;margin:9px 0
}
.icon{font-size:27px}
.evidence-card h3{margin:4px 0}
.tag{font-size:11px;color:#c4b5fd;border:1px solid #44326f;border-radius:99px;padding:4px 8px;display:inline-block}
.unlocked{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.progress{
 height:8px;border-radius:99px;background:#111a30;overflow:hidden;margin:8px 0 15px
}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:.4s}
#toast{
 position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);
 opacity:0;z-index:100;background:#101a32;border:1px solid #3b82f6;
 padding:13px 18px;border-radius:14px;transition:.3s;max-width:90%;text-align:center
}
#toast.show{opacity:1;transform:translateX(-50%)}
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
 align-items:center;justify-content:center;padding:18px;z-index:90
}
.modal.show{display:flex}
.modal-box{width:min(560px,100%);max-height:90vh;overflow:auto}
.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:480px){.option-grid{grid-template-columns:repeat(2,1fr)}}
.number-btn{font-size:25px;font-weight:900}
.top-actions{display:flex;gap:7px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:900}
.score{color:var(--green);font-weight:900}
.lock{font-size:22px}
.connection{
 border-right:3px solid var(--purple);padding:12px 14px;background:#0c1328;border-radius:12px;margin:8px 0
}
footer{text-align:center;color:#53627d;font-size:12px;padding:25px}
</style>
</head>

<body>
<div id="app">

<!-- القائمة -->
<section id="home" class="screen active">
 <div class="container" style="margin-top:auto;margin-bottom:auto">
  <div class="logo">أثر متسلسل</div>
  <div class="subtitle">SERIAL TRACE<br>لعبة التحقيق الجماعية</div>
  <div class="card menu">
   <button class="btn primary" onclick="showScreen('players')">▶ ابدأ التحقيق</button>
   <button class="btn" onclick="showHowTo()">؟ كيف نلعب؟</button>
   <button class="btn" onclick="showCases()">📁 القضايا</button>
   <button class="btn" onclick="toggleSound()">🔊 الصوت: <span id="soundLabel">مفعل</span></button>
  </div>
  <footer>2–6 محققين • جهاز واحد • تعمل دون إنترنت</footer>
 </div>
</section>

<!-- عدد اللاعبين -->
<section id="players" class="screen">
 <div class="container">
  <div class="header">
   <button class="btn small" onclick="showScreen('home')">← رجوع</button>
   <div class="header-title">عدد المحققين</div>
  </div>
  <div class="card center">
   <h2>كم عدد المحققين؟</h2>
   <p class="muted">كل اللاعبين محققون. لا يوجد لاعب مجرم.</p>
   <div class="option-grid" style="margin-top:20px">
    <button class="btn number-btn" onclick="setPlayers(2)">2</button>
    <button class="btn number-btn" onclick="setPlayers(3)">3</button>
    <button class="btn number-btn" onclick="setPlayers(4)">4</button>
    <button class="btn number-btn" onclick="setPlayers(5)">5</button>
    <button class="btn number-btn" onclick="setPlayers(6)">6</button>
   </div>
  </div>
 </div>
</section>

<!-- الأسماء -->
<section id="names" class="screen">
 <div class="container">
  <div class="header">
   <button class="btn small" onclick="showScreen('players')">← رجوع</button>
   <div class="header-title">أسماء المحققين</div>
  </div>
  <div class="card">
   <h2>سجلوا أسماء الفريق</h2>
   <div id="namesBox"></div>
   <button class="btn primary" onclick="saveNames()">متابعة ←</button>
  </div>
 </div>
</section>

<!-- القضايا -->
<section id="cases" class="screen">
 <div class="container">
  <div class="header">
   <button class="btn small" onclick="showScreen('home')">← الرئيسية</button>
   <div class="header-title">ملفات القضايا</div>
  </div>
  <div id="casesGrid" class="grid grid2"></div>
 </div>
</section>

<!-- مقدمة القضية -->
<section id="intro" class="screen">
 <div class="container">
  <div class="header">
   <button class="btn small" onclick="leaveCase()">🚪 خروج من القضية</button>
   <div class="header-title">ملف القضية</div>
  </div>
  <div id="introBox"></div>
 </div>
</section>

<!-- لوحة التحقيق -->
<section id="board" class="screen">
 <div class="container">
  <div class="header">
   <div class="top-actions">
    <button class="btn small" onclick="backToPaths()">↩ المسارات</button>
    <button class="btn small danger" onclick="leaveCase()">🚪 خروج</button>
   </div>
   <div class="header-title"><span id="caseHeader"></span> <span class="timer" id="timer"></span></div>
  </div>

  <div class="grid grid3">
   <div class="stat"><b id="scoreView">0</b>النقاط</div>
   <div class="stat"><b id="evidenceCount">0</b>الأدلة</div>
   <div class="stat"><b id="attemptsView">3</b>المحاولات</div>
  </div>

  <div class="tabs" style="margin-top:14px">
   <button class="tab active" onclick="openTab('paths',this)">🔎 التحقيق</button>
   <button class="tab" onclick="openTab('evidence',this)">🧩 الأدلة</button>
   <button class="tab" onclick="openTab('suspects',this)">👤 المشتبه بهم</button>
   <button class="tab" onclick="openTab('timeline',this)">🕐 الخط الزمني</button>
   <button class="tab" onclick="openTab('map',this)">📍 الخريطة</button>
   <button class="tab" onclick="openTab('connections',this)">🔗 الروابط</button>
  </div>

  <div id="tabContent"></div>
 </div>
</section>

<!-- التحقيق النهائي -->
<section id="final" class="screen">
 <div class="container">
  <div class="header">
   <button class="btn small" onclick="backToPaths()">← العودة للتحقيق</button>
   <div class="header-title">التحقيق النهائي</div>
  </div>
  <div id="finalBox"></div>
 </div>
</section>

<!-- النتيجة -->
<section id="result" class="screen">
 <div class="container">
  <div id="resultBox"></div>
 </div>
</section>

</div>

<div id="toast"></div>

<div id="modal" class="modal">
 <div class="modal-box card" id="modalBox"></div>
</div>

<script>

/* =========================================================

========================================================= */

const $=id=>document.getElementById(id);

let state={

 connections:[],

const icons={

/*
  نبني بيانات كل قضية من بذرة مختلفة.
  الأدلة والمسارات تتغير وفق رقم القضية.
  لا يتم وضع الحل في الواجهة.
*/
function buildCases(){
 return caseSeeds.map((s,i)=>{
   const [title,city,crime,criminal,job,place]=s;

   الصوت
========================================================= */
let audioCtx=null;
function beep(freq=500,duration=.06,type="sine"){
 if(!state.sound)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.035,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration);
 }catch(e){}
}
function toggleSound(){
 state.sound=!state.sound;saveGame();updateSoundLabel();beep();
}

function takePath(pathId){
 const c=cases[state.selectedCase];
 const p=c.paths.find(x=>x.id===pathId);
 if(!p)return;
 beep(650,.07);

 let newly=[];
 p.gives.forEach(id=>{
  if(!state.discovered.includes(id)){
   state.discovered.push(id);
   newly.push(id);
  }
 });
 state.score+=50;
 state.currentPath=pathId;

 if(newly.length){
  newly.forEach(id=>{
   const e=c.evidence.find(x=>x.id===id);
   toast(`🧩 دليل جديد: ${e.title}`);
  });
 }else{
  toast("هذا المسار تمت مراجعته بالفعل. جربوا مسارًا آخر.");
 }
 renderBoard();
}

 return `<div class="card">
  <h2>🕐 الخط الزمني</h2>
  <p class="muted">قارنوا التوقيت مع روايات المشتبه بهم.</p>
  ${c.timeline.map((x,i)=>`
   <div class="timeline-card">
    <span class="badge">${x[0]}</span>
    <p>${x[1]}</p>
   </div>`).join("")}
  <button class="btn primary" onclick="analyzeTimeline()">🔬 تحليل التناقضات</button>
 </div>`;
}

function analyzeTimeline(){
 const c=cases[state.selectedCase];
 if(!state.discovered.includes(c.requiredEvidence[0])){
  toast("تحتاجون إلى مزيد من الأدلة قبل تثبيت الخط الزمني.");
  return;
 }
 if(!state.analyzed.includes(c.requiredEvidence[2])){
  state.analyzed.push(c.requiredEvidence[2]);
  state.score+=150;
 }
 toast("🕐 تم اكتشاف فجوة زمنية مهمة +150");
 updateStats();
}

function mapHTML(c){
 const points=[
  ["📍",c.city,"موقع القضية"],
  ["📍",c.place,"الموقع الرئيسي"],
  ["🚗","طريق فرعي","مسار المركبة"],
  ["📍","الأرشيف","سجل الدخول"]
 ];
 return `<div class="card">
  <h2>🗺️ خريطة التحقيق</h2>
  <div style="height:280px;border:1px solid #263659;border-radius:18px;background:
   linear-gradient(35deg,transparent 48%,#263659 49%,#263659 51%,transparent 52%),
   linear-gradient(120deg,transparent 48%,#1b2b4d 49%,#1b2b4d 51%,transparent 52%),#081022;
   position:relative;overflow:hidden">
   ${points.map((p,i)=>`<div style="position:absolute;top:${20+i*18}%;right:${15+i*18}%;background:#111a31;border:1px solid #38bdf8;border-radius:12px;padding:7px">${p[0]} ${p[1]}</div>`).join("")}
  </div>
  <p class="muted">الخريطة تساعدكم على مقارنة المواقع، لكنها ليست دليل إدانة بمفردها.</p>
 </div>`;
}

function connectionsHTML(c){
 return `<div class="card">
  <h2>🔗 روابط الأدلة</h2>
  <p class="muted">اختاروا دليلين لمحاولة اكتشاف علاقة بينهما.</p>
  <div class="grid grid2">
   ${state.discovered.map(id=>{
    const e=c.evidence.find(x=>x.id===id);
    return `<button class="choice" onclick="selectConnection('${id}')">${icons[e.type]} ${e.title}</button>`;
   }).join("")}
  </div>
  ${state.connections.length?`
   <h3 style="margin-top:20px">الروابط المكتشفة</h3>
   ${state.connections.map(x=>`<div class="connection">🔗 ${x}</div>`).join("")}
  `:""}
 </div>`;
}

let pendingConnection=null;
function selectConnection(id){
 if(!pendingConnection){
  pendingConnection=id;
  toast("اختروا الدليل الثاني");
  return;
 }
 if(pendingConnection===id){toast("اختاروا دليلًا مختلفًا");return}
 connectEvidence(pendingConnection,id);
 pendingConnection=null;
}

function connectEvidence(a,b){
 const c=cases[state.selectedCase];
 const pair=c.connections.find(x=>
  (x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a)
 );
 if(pair){
  if(!state.connections.includes(pair[2])){
   state.connections.push(pair[2]);
   state.score+=100;
   beep(900,.12);
   toast("🔗 Connection Found +100");
  }
 }else{
  state.score-=20;
  toast("لا توجد علاقة مؤكدة بين هذين الدليلين.");
 }
 openTab("connections",null);
 updateStats();
}

/* =========================================================
   التلميحات
========================================================= */
function showHint(){
 const c=cases[state.selectedCase];
 if(state.hintsUsed>=c.hints.length){toast("لا توجد تلميحات إضافية.");return}
 const hint=c.hints[state.hintsUsed++];
 state.score=Math.max(0,state.score-50);
 $("modalBox").innerHTML=`
  <span class="tag">💡 تلميح ${state.hintsUsed}</span>
  <h2>إشارة للمحققين</h2>
  <p style="font-size:18px;line-height:1.8">${hint}</p>
  <p class="muted">تم خصم 50 نقطة.</p>
  <button class="btn primary" onclick="closeModal()">فهمت</button>`;
 $("modal").classList.add("show");
 updateStats();
}

/* =========================================================
   التحقيق النهائي
========================================================= */
function finalInvestigation(){
 const c=cases[state.selectedCase];
 if(state.discovered.length<4){
  toast("اجمعوا 4 أدلة على الأقل قبل التحقيق النهائي.");
  return;
 }

 $("finalBox").innerHTML=`
  <div class="card">
   <h1>🎯 من هو المجرم؟</h1>
   <p class="muted">لا تعتمدوا على دليل واحد. اختاروا الشخصية التي تفسر أكبر عدد من الأدلة والتناقضات.</p>
   <div id="suspectChoices">
   ${c.suspects.map((s,i)=>`
    <button class="choice" onclick="chooseFinalSuspect(${i})">
     <div class="ct">${s.name}</div>
     <div class="cd">${s.age} سنة • ${s.job}</div>
    </button>`).join("")}
   </div>
  </div>`;
 showScreen("final");
}

function chooseFinalSuspect(i){
 state.selectedSuspect=i;
 const c=cases[state.selectedCase],s=c.suspects[i];

 $("finalBox").innerHTML=`
 <div class="card">
  <span class="badge">المرحلة الأخيرة</span>
  <h2>اختر الأدلة التي تثبت نظريتكم</h2>
  <p>يمكن اختيار من 1 إلى 5 أدلة.</p>
  <div id="finalEvidenceList">
   ${state.discovered.map(id=>{
    const e=c.evidence.find(x=>x.id===id);
    return `<label class="choice" style="display:block">
      <input type="checkbox" value="${id}" style="width:auto;margin-left:8px">
      ${icons[e.type]} ${e.title}
    </label>`;
   }).join("")}
  </div>
  <h3 style="margin-top:20px">لماذا؟</h3>
  <div id="reasonList">
   ${[
    "Timeline contradiction",
    "Camera evidence",
    "Vehicle connection",
    "Witness contradiction",
    "Location evidence",
    "Multiple clues match"
   ].map((r,i)=>`
    <label class="choice" style="display:block">
     <input type="checkbox" value="${i}" style="width:auto;margin-left:8px">
     ${reasonArabic(r)}
    </label>`).join("")}
  </div>
  <button class="btn primary" style="margin-top:15px" onclick="submitTheory()">إرسال النظرية 🔥</button>
 </div>`;
}

function reasonArabic(x){
 return {
  "Timeline contradiction":"تناقض في الخط الزمني",
  "Camera evidence":"دليل الكاميرا",
  "Vehicle connection":"صلة المركبة",
  "Witness contradiction":"تناقض الشاهد",
  "Location evidence":"دليل الموقع",
  "Multiple clues match":"تطابق عدة أدلة"
 }[x]||x;
}

function submitTheory(){
 const c=cases[state.selectedCase];
 const selected=[...document.querySelectorAll('#finalEvidenceList input:checked')].map(x=>x.value);
 const reasons=[...document.querySelectorAll('#reasonList input:checked')].map(x=>x.value);

 if(!selected.length){toast("اختاروا دليلًا واحدًا على الأقل.");return}
 if(!reasons.length){toast("اختاروا سببًا واحدًا على الأقل.");return}

 const suspect=c.suspects[state.selectedSuspect];
 const correct=suspect.name===c.solution;

 if(correct){
  let bonus=500;
  const correctCount=selected.filter(id=>c.requiredEvidence.includes(id)).length;
  bonus+=correctCount*100;
  if(state.connections.length)bonus+=100;
  if(state.analyzed.includes(c.requiredEvidence[2]))bonus+=150;
  state.score+=bonus;
  finishCase(true,selected,reasons,bonus);
 }else{
  state.attempts--;
  state.score=Math.max(0,state.score-200);
  if(state.attempts<=0){
   finishCase(false,selected,reasons,0,true);
  }else{
   showLastHint();
  }
 }
 updateStats();
}

function showLastHint(){
 const c=cases[state.selectedCase];
 const hint=c.hints[Math.min(4,state.hintsUsed)];
 $("modalBox").innerHTML=`
  <h2>❌ النظرية غير صحيحة</h2>
  <p>لم تكن الشخصية المختارة هي الحل.</p>
  <div class="card">
   <h3>💡 فرصة أخيرة للتحليل</h3>
   <p>${hint}</p>
  </div>
  <p class="muted">المحاولات المتبقية: ${state.attempts}</p>
  <button class="btn primary" onclick="closeModal();backToPaths()">العودة للتحقيق</button>`;
 $("modal").classList.add("show");
 beep(180,.15,"sawtooth");
}

function finishCase(correct,selected,reasons,bonus,gaveUp=false){
 clearInterval(state.timerInterval);
 const c=cases[state.selectedCase];
 if(correct){
  if(state.selectedCase+1<cases.length)
   state.unlockedCases=Math.max(state.unlockedCases,state.selectedCase+2);
  saveGame();
 }
 const elapsed=Math.floor((Date.now()-state.startedAt)/1000);
 const mins=Math.floor(elapsed/60),secs=elapsed%60;

 $("resultBox").innerHTML=`
 <div class="card center">
  <div style="font-size:65px">${correct?"🎯":"🧊"}</div>
  <h1>${correct?"تم حل القضية":"النظرية غير صحيحة"}</h1>
  <h2>${correct?"عمل ممتاز أيها المحققون":"القضية أصبحت باردة"}</h2>
  ${correct?
   `<p>المجرم الحقيقي هو: <strong style="color:var(--green);font-size:24px">${c.solution}</strong></p>
    <p class="score">+${bonus} نقطة</p>`:
   `<p>استنفدتم المحاولات المتاحة في هذه القضية.</p>
    <p>الحل الصحيح كان: <strong>${c.solution}</strong></p>`}
  <div class="grid grid3" style="margin:20px 0">
   <div class="stat"><b>${state.score}</b>النقاط</div>
   <div class="stat"><b>${state.discovered.length}</b>أدلة</div>
   <div class="stat"><b>${mins}:${secs.toString().padStart(2,"0")}</b>الوقت</div>
  </div>
  <div class="card" style="text-align:right">
   <h3>الأدلة الحاسمة</h3>
   ${c.requiredEvidence.map(id=>{
    const e=c.evidence.find(x=>x.id===id);
    return `<p>✓ ${e.title}</p>`;
   }).join("")}
   <h3>التناقضات</h3>
   <p>تم اكتشاف فجوة بين سجل الدخول ومسار الحركة، ثم تم تثبيت التناقض بالخط الزمني.</p>
  </div>
  <div class="row" style="margin-top:15px">
   <button class="btn primary" onclick="nextCase()">القضية التالية →</button>
   <button class="btn" onclick="showCases()">كل القضايا</button>
  </div>
 </div>`;
 showScreen("result");
 if(correct)beep(1000,.2);
}

function nextCase(){
 const next=state.selectedCase+1;
 if(next<cases.length && next<state.unlockedCases){
  startCase(next);
 }else showCases();
}

/* =========================================================
   الإحصائيات
========================================================= */
function updateStats(){
 if($("scoreView"))$("scoreView").textContent=state.score;
 if($("evidenceCount"))$("evidenceCount").textContent=state.discovered.length;
 if($("attemptsView"))$("attemptsView").textContent=state.attempts;
}

/* =========================================================
   HOW TO PLAY
========================================================= */
function showHowTo(){
 $("modalBox").innerHTML=`
 <h2>🕵️ كيف تلعبون؟</h2>
 <ol style="line-height:2">
  <li>اختاروا عدد المحققين واكتبوا أسماء الفريق.</li>
  <li>اختاروا قضية من ملفات القضايا.</li>
  <li>في كل خطوة ستظهر أمامكم اختيارات مختلفة للتحقيق.</li>
  <li>راجعوا الكاميرات أو اسألوا الشهود أو افحصوا المركبات أو الاتصالات.</li>
  <li>بعض المسارات لا تفتح إلا بعد اكتشاف دليل سابق.</li>
  <li>يمكنكم العودة إلى «المسارات» في أي وقت وتجربة طريق آخر.</li>
  <li>افتحوا الأدلة وحللوها.</li>
  <li>قارنوا الأدلة مع الخط الزمني.</li>
  <li>اربطوا الأدلة ببعضها لاكتشاف العلاقات.</li>
  <li>في النهاية اختاروا المشتبه به والأدلة التي تثبت نظريتكم.</li>
  <li>إذا أخطأتم، تحصلون على تلميح ويمكنكم إعادة التحقيق ما دامت المحاولات موجودة.</li>
 </ol>
 <div class="card">
  <strong>مهم:</strong> لا يوجد لاعب مجرم. كل اللاعبين محققون، والمجرم شخصية NPC داخل القضية.
 </div>
 <button class="btn primary" onclick="closeModal()">ابدأ</button>`;
 $("modal").classList.add("show");
}

 if(e.key==="Escape")closeModal();
});

/* =========================================================

loadSave();
showCases();
